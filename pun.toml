# Written by `pun migrate` from pint.json.
[files]
exclude = ["vendor", "storage", "bootstrap/cache", "json"]

[extensions]
laravel = "on"
pest = "on"
phpunit = "on"
carbon = "on"
mockery = "on"

[format]
preset = "psr12"

[format.rules]
"imports/single-per-statement" = true
"arrays/indentation" = true
"arrays/syntax" = true
"arrays/trailing-comma-multiline" = true
"arrays/no-space-before-comma" = true
"strings/single-quote" = true
"attributes/no-block-spaces" = true
"comments/align-multiline" = true

[lint]
sets = ["rector/dead-code", "rector/code-quality", "rector/type-declaration", "rector/privatization", "rector/php-polyfills", "rector/php-sets"]
