name: Feature Request
description: Suggest a new feature or enhancement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement.

  - type: input
    id: summary
    attributes:
      label: Feature Summary
      placeholder: Add dark mode support
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
      placeholder: Users cannot comfortably use the application at night.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      placeholder: Add a theme switcher with dark/light mode.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] User can switch theme
        - [ ] Preference is saved
        - [ ] Works on mobile

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
