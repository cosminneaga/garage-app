name: Bug Report
description: Report something that is not working correctly.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please provide as much information as possible.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Brief description of the issue.
      placeholder: Login page throws 500 error
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Explain how to reproduce the issue.
      placeholder: |
        1. Go to...
        2. Click...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      placeholder: The user should be redirected to the dashboard.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      placeholder: A 500 Internal Server Error is displayed.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Production / Staging / Local

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
